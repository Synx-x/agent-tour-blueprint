# Illustrative shape only. Replace every field with validated host-system data.
# Validates against scenario.schema.json in this directory.
id: first-safe-workflow
title: Complete a sample task
audience: first-time user
fixture_requirements:
  - synthetic-demo-record-exists
steps:
  - id: welcome
    title: Start in the demo workspace
    narration: This tour uses a disposable demo workspace, not your account data.
    # A localized product uses narration_key (and title_key, caption_key) instead of literal text.
    destination: null
    target: null
    action: null
    success_check: demo-banner-visible
    timeout_seconds: 5
    recovery: Exit the tour if the demo banner is missing.

  - id: inspect-record
    title: Find the sample record
    narration: Use the product's normal navigation to open the sample record.
    destination: records
    target: tour.record.search
    action:
      kind: visible-ui
      operation: open-synthetic-demo-record
      # The cursor runs these on screen. Values come from the fixture, not UI code.
      drive:
        stage: records
        steps:
          - { do: fill, target: tour.record.search, value: "<fixture record name>", caption: Searching for the sample }
          - { do: click, target: tour.record.open, row: "<fixture record id>", caption: Opening it }
      fallback: none # read-only step: no direct path
    success_check: selected-record-id-equals-fixture-id
    timeout_seconds: 15
    recovery: Offer retry or skip; never substitute a real user's record.

  - id: make-reversible-change
    title: Change one safe field
    narration: This demo change is scoped to the disposable workspace and can be undone.
    destination: records
    target: tour.record.edit
    fallback_target: tour.records.panel # always laid out; used after a short grace period
    action:
      kind: visible-ui
      operation: update-demo-field
      drive:
        stage: records
        steps:
          - { do: click, target: tour.record.edit, row: "<fixture record id>", caption: Opening the editor }
          - { do: fill, target: tour.record.status-note, value: "<example value>", caption: Typing the change }
          - { do: click, target: tour.record.save, caption: Saving }
      # Used only when the engine reports a control missing (for example at 320 px).
      # Same validation, same postcondition. The runner records `screen` or `direct`.
      fallback: direct-update-demo-field
      once: true # disable Show me after success, re-offer only after a failure
      self_heal: clear-blocking-open-edit # find or create the needed state inside the demo scope
    follow: open-updated-record # take the user to the changed object
    success_check: demo-record-field-matches-example-value
    undo_change_id: capture-exact-tour-change-id
    timeout_seconds: 15
    recovery: Verify the fixture state before retrying; otherwise offer exit.

  - id: undo-demo-change
    title: Undo the tour's change
    narration: Undo only the change made in this tour.
    destination: activity
    target: tour.activity.undo-exact-change
    needs_result_of: make-reversible-change # if missing, explain and point back; never hide the step
    action:
      kind: visible-ui
      operation: undo-captured-tour-change-id
      drive:
        stage: activity
        steps:
          - { do: click, target: tour.activity.undo, row: "<captured change id>", caption: Undoing the tour's change }
      fallback: direct-revert-captured-change-id
      once: true
    success_check: demo-record-matches-pre-tour-snapshot
    timeout_seconds: 15
    recovery: If undo fails, disclose it and provide the product's safe manual recovery path.
